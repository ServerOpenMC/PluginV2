name: Release to Discord
on:
  release:
    types: [published]

jobs:
  github-releases-to-discord:
    runs-on: ubuntu-latest
    name: Release to Discord
    steps:
      - name: Github Releases To Discord
        uses: SethCohen/github-releases-to-discord@v1.20.0
        with:
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          color: "16021398" # decimal of #f47796
          content: "<@&1481720005400854629>" # mention @Ping release
          username: "Toor"
          avatar_url: "cdn.discordapp.com/avatars/1481723894745534474/d5cd8478f26e954629f58760e8ab049d?size=256"
          footer_title: "Changements"
          footer_icon_url: "https://raw.githubusercontent.com/ServerOpenMC/.github/refs/heads/master/brandkit/logo.png"
          footer_timestamp: true
          max_description: '16384'
          reduce_headings: true
