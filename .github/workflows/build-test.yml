name: Build & Test

on:
  pull_request:
    paths-ignore:
      - ".gitignore"
      - "LICENSE"
      - "README.md"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
  push:
    # Default branch only: branches with an open PR are already covered by the
    # pull_request trigger, so pushing to them used to start every run twice.
    branches: [master]
    paths-ignore:
      - ".gitignore"
      - "LICENSE"
      - "README.md"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
  workflow_dispatch:

# A newer push to the same PR cancels the run that is still in progress.
# Runs on master and manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write # dorny/test-reporter creates a check run (not possible on fork PRs)
    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@v1

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Tests with Gradle
        run: ./gradlew test --no-daemon --stacktrace

      - name: Report test results
        uses: dorny/test-reporter@v3
        # Fork PRs get a read-only token and cannot create check runs, so the
        # reporter is skipped there (the failure is still visible in the Gradle log).
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          name: Gradle Tests
          path: build/test-results/test/*.xml
          reporter: java-junit
          fail-on-error: true

  build:
    name: Build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with snapshot version
        env:
          SNAPSHOT: true
          GITHUB_SHA: ${{ github.sha }}
        run: ./gradlew jar --no-daemon --stacktrace

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v7
        with:
          name: OpenMC-${{ github.sha }}
          path: builds/
