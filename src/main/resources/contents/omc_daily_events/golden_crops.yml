info:
  namespace: omc_daily_events

items:
  # --- Golden Pumpkin ---
  golden_pumpkin:
    display_name: <lang:itemsadder.omc_daily_events.golden_pumpkin.name>
    lore:
      - <lang:itemsadder.omc_daily_events.golden_pumpkin.lore.0>
    graphics:
      textures:
        north: golden_crops/pumpkin/golden_pumpkin_side
        south: golden_crops/pumpkin/golden_pumpkin_side
        east: golden_crops/pumpkin/golden_pumpkin_side
        west: golden_crops/pumpkin/golden_pumpkin_side
        up: golden_crops/pumpkin/golden_pumpkin_top
        down: golden_crops/pumpkin/golden_pumpkin_side
    behaviours:
      block:
        placed_model:
          type: REAL_NOTE
          break_particles: ITEM
        hardness: 4

  # --- Golden Melon ---
  golden_melon:
    display_name: <lang:itemsadder.omc_daily_events.golden_melon.name>
    lore:
      - <lang:itemsadder.omc_daily_events.golden_melon.lore.0>
    graphics:
      textures:
        north: golden_crops/melon/golden_melon_side
        south: golden_crops/melon/golden_melon_side
        east: golden_crops/melon/golden_melon_side
        west: golden_crops/melon/golden_melon_side
        up: golden_crops/melon/golden_melon_top
        down: golden_crops/melon/golden_melon_side
    behaviours:
      block:
        placed_model:
          type: REAL_NOTE
          break_particles: ITEM
        hardness: 4

  golden_beetroot:
    display_name: <lang:itemsadder.omc_daily_events.golden_beetroot.name>
    resource:
      generate: true
      textures:
        - golden_crops/golden_beetroot
      material: PAPER
    lore:
      - <lang:itemsadder.omc_daily_events.golden_beetroot.lore.0>

  golden_potato:
    display_name: <lang:itemsadder.omc_daily_events.golden_potato.name>
    resource:
      generate: true
      textures:
        - golden_crops/golden_potato
      material: PAPER
    lore:
      - <lang:itemsadder.omc_daily_events.golden_potato.lore.0>

  golden_wheat:
    display_name: <lang:itemsadder.omc_daily_events.golden_wheat.name>
    resource:
      generate: true
      textures:
        - golden_crops/golden_wheat
      material: PAPER
    lore:
      - <lang:itemsadder.omc_daily_events.golden_wheat.lore.0>

  golden_wheat_compacted:
    display_name: <lang:itemsadder.omc_daily_events.golden_wheat_compacted.name>
    glint: true
    resource:
      generate: true
      textures:
        - golden_crops/golden_wheat
      material: PAPER
    lore:
      - <lang:itemsadder.omc_daily_events.golden_wheat.lore.0>

  golden_wheat_block:
    display_name: <lang:itemsadder.omc_daily_events.golden_wheat_block.name>
    glint: true
    resource:
      generate: false
      model_path: "minecraft:block/hay_block"
      material: PAPER

  really_golden_carrot:
    display_name: <lang:itemsadder.omc_daily_events.really_golden_carrot.name>
    resource:
      generate: true
      textures:
        - golden_crops/really_golden_carrot
      material: PAPER
    lore:
      - <lang:itemsadder.omc_daily_events.really_golden_carrot.lore.0>

  aywenite_lamp_template:
    template: true
    name: <lang:itemsadder.omc_daily_events.aywenite_lamp.name>
    lore:
      - <lang:itemsadder.omc_daily_events.aywenite_lamp.lore.0>
    graphics:
      texture: blocks/aywenite_lamp/aywenite_lamp_off
    behaviours:
      block:
        placed_model:
          type: REAL_NOTE
        hardness: 0.3
        blast_resistance: 0.3
        sound:
          break:
            name: block.glass.break
            volume: 1.0
            pitch: 0.8
          place:
            name: block.glass.place
            volume: 1.0
            pitch: 0.8
          hit:
            name: block.glass.hit
            volume: 0.25
            pitch: 0.5
          fall:
            name: block.glass.fall
            volume: 0.5
            pitch: 0.75
          step:
            name: block.glass.step
            volume: 0.15
            pitch: 1.0

  aywenite_lamp:
    variant_of: aywenite_lamp_template
    events:
      placed_block:
        interact:
          replace_block:
            from: aywenite_lamp
            to: aywenite_lamp_on

  aywenite_lamp_on:
    variant_of: aywenite_lamp_template
    graphics:
      texture: blocks/aywenite_lamp/aywenite_lamp_on
    behaviours:
      block:
        placed_model:
          type: REAL_NOTE
        light_level: 15
        drop_when_mined: false
    events:
      placed_block:
        interact:
          replace_block:
            from: aywenite_lamp_on
            to: aywenite_lamp
        break:
          drop_item:
            item: aywenite_lamp
            min_amount: 1
            max_amount: 1
            chance: 100

recipes:
  crafting_table:
    golden_wheat_compacted:
      enabled: true
      pattern:
        - AAA
        - AAA
        - AAA
      ingredients:
        A: omc_daily_events:golden_wheat
      result:
        item: omc_daily_events:golden_wheat_compacted
        amount: 1

    golden_wheat_block:
      enabled: true
      pattern:
        - AAA
        - AAA
        - AAA
      ingredients:
        A: omc_daily_events:golden_wheat_compacted
      result:
        item: omc_daily_events:golden_wheat_block
        amount: 1

    aywenite_lamp:
      pattern:
        - AAA
        - ALA
        - AAA
      ingredients:
        A: omc_blocks:aywenite_block
        L: REDSTONE_LAMP
      result:
        item: omc_daily_events:aywenite_lamp_on