plugins {
    id 'java'
    id "com.gradleup.shadow" version "${shadowVersion}"
    id "io.papermc.paperweight.userdev" version "${paperWeightUserDevVersion}"
    id("xyz.jpenilla.run-paper") version "${runPaperVersion}"
}

def getLatestGitTag() {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'describe', '--tags', '--abbrev=0'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (Exception ignored) {
        return "unknown" // Default value if no tags exist
    }
}

// Versioning
def tag = System.getenv("TAG") ?: getLatestGitTag()
def isSnapshot = System.getenv('SNAPSHOT')?.toBoolean() ?: false
def gitHash = System.getenv('GITHUB_SHA') ?: 'local'

version = isSnapshot ? "$tag-SNAPSHOT-${gitHash.take(7)}" : (System.getenv("TAG") ? tag : "dev-$tag")
group = 'fr.openmc'

repositories {
    mavenCentral()
    maven {
        url "https://repo.extendedclip.com/content/repositories/placeholderapi/"
    }
    maven {
        url "https://maven.enginehub.org/repo/"
    }
    maven {
        url "https://repo.fancyinnovations.com/releases"
    }
    maven {
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        url "https://maven.devs.beer/"
    }
    maven {
        url "https://repo.dmulloy2.net/repository/public/"
    }
    // * GeyserMC
    //maven {url "https://repo.opencollab.dev/main/"}
    maven {
        url "https://jitpack.io" // Toujours à la fin
    }
}

dependencies {
    paperweight.paperDevBundle "${minecraftVersion}.build.${paperVersion}"

    compileOnly "com.sk89q.worldguard:worldguard-bukkit:${worldguardApiVersion}"
    compileOnly "beer.devs:itemsadder-api:${itemsAdderApiVersion}"
    compileOnly "net.luckperms:api:${luckpermsApiVersion}"
    compileOnly "me.clip:placeholderapi:${papiApiVersion}"
    compileOnly "com.sk89q.worldedit:worldedit-bukkit:${worldeditApiVersion}"
    compileOnly "de.oliver:FancyNpcs:${fancyNpcsApiVersion}"
    compileOnly "net.dmulloy2:ProtocolLib:${protocolLibApiVersion}"

    // Bedrock Dependencies
    //compileOnly files("libs/RiftEngine-${riftEngineVersion}.jar")
    //compileOnly "org.geysermc.geyser:api:${geyserApiVersion}"
    //compileOnly "org.geysermc.floodgate:api:${floodgateApiVersion}"

    implementation "org.jetbrains:annotations:${jetbrainsAnnotationsVersion}"
    implementation "io.github.revxrsal:lamp.common:${revxrsalLampVersion}"
    implementation "io.github.revxrsal:lamp.bukkit:${revxrsalLampVersion}"
    implementation "com.j256.ormlite:ormlite-jdbc:${ormVersion}"
    implementation "com.h2database:h2:${h2DatabaseVersion}"

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation "org.slf4j:slf4j-simple:${slf4jVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation paperweight.paperDevBundle("${minecraftVersion}.build.${paperVersion}")
    testImplementation "org.mockbukkit.mockbukkit:mockbukkit-v${mockbukkitMcVersion}:${mockbukkitVersion}"
    testImplementation "com.h2database:h2:${h2DatabaseVersion}"
}

def targetJavaVersion = javaTargetVersion.toInteger()
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

paperweight {
    addServerDependencyTo = configurations.named(JavaPlugin.COMPILE_ONLY_CONFIGURATION_NAME).map { [it] as Set }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = targetJavaVersion
}

processResources {
    filteringCharset = 'UTF-8'

    def pluginProps = ["version": version, "minecraftVersion": minecraftVersion]
    inputs.properties(pluginProps)

    filesMatching('paper-plugin.yml') {
        expand(pluginProps)
    }

    filesMatching('data/motd.yml') {
        expand(pluginProps)
    }
}

tasks.jar {
    manifest {
        attributes 'GIT-COMMIT': gitHash
    }
    destinationDirectory.set(file('./builds/'))
}

tasks.clean {
    delete 'builds'
}

tasks.shadowJar {
    destinationDirectory.set(file('./builds/'))
    archiveFileName.set('OpenMC.jar')

    relocate("org.jetbrains.annotations", "fr.openmc.shaded.org.jetbrains.annotations")
    relocate("org.intellij", "fr.openmc.shaded.org.intellij")
    relocate("revxrsal.commands", "fr.openmc.shaded.revxrsal.commands")
    relocate("com.j256.ormlite", "fr.openmc.shaded.com.j256.ormlite")
}

def hotswapAgentFile = layout.buildDirectory.file("hotswap/hotswap-agent-${hotswapAgentVersion}.jar").get().asFile

tasks.register('downloadHotswapAgent') {
    outputs.file(hotswapAgentFile)
    onlyIf {
        !hotswapAgentFile.exists()
    }
    doLast {
        hotswapAgentFile.parentFile.mkdirs()
        new URL("https://github.com/HotswapProjects/HotswapAgent/releases/download/RELEASE-${hotswapAgentVersion}/hotswap-agent-${hotswapAgentVersion}.jar")
                .withInputStream {
                    input -> hotswapAgentFile.withOutputStream {
                        it << input
                    }
                }
    }
}

tasks.register('prepareRunServer', Copy) {
    from 'run-conf'
    into 'run'
}

tasks.runServer {
    dependsOn tasks.named('downloadHotswapAgent')
    dependsOn tasks.named('prepareRunServer')

    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
        vendor = JvmVendorSpec.JETBRAINS
    })

    standardInput = System.in
    minecraftVersion("${minecraftVersion}")

    systemProperty(
            "net.kyori.adventure.text.warnWhenLegacyFormattingDetected",
            rootProject.findProperty("net.kyori.adventure.text.warnWhenLegacyFormattingDetected") ?: false
    )
    systemProperty("com.mojang.eula.agree", rootProject.findProperty("com.mojang.eula.agree") ?: true)
    systemProperty("Paper.IgnoreJavaVersion", true)

    jvmArgs(
            "-Xmx4096M",
            "-Xms4096M",
            "-XX:+AllowEnhancedClassRedefinition",
            "-javaagent:${hotswapAgentFile.absolutePath}"
    )

    downloadPlugins {
        modrinth("FancyNpcs", fancyNpcsVersion)
        modrinth("FastAsyncWorldEdit", fastAsyncWorldEditVersion)
        modrinth("LuckPerms", luckPermsVersion)
        modrinth("PlaceholderAPI", papiVersion)
        modrinth("WorldGuard", worldGuardVersion)
        url("https://github.com/dmulloy2/ProtocolLib/releases/download/dev-build/ProtocolLib.jar")
    }
}

tasks.test {
    useJUnitPlatform()
}